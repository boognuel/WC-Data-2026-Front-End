<div class="login-container">
  <div class="login-card">
    <div class="brand-row">
      <app-wc-logo [size]="44" />
      <span class="brand-name">WC26</span>
    </div>
    <h2>Cambiar contraseña</h2>
    <p>Tu contraseña ha expirado. Ingresa una nueva.</p>

    <form [formGroup]="form" (ngSubmit)="cambiar()" novalidate>
      <label for="cc-user">Usuario</label>
      <input
        id="cc-user"
        type="text"
        formControlName="username"
        aria-required="true"
        [attr.readonly]="pendingUsername ? true : null"
      />

      <label for="cc-pass">Nueva contraseña</label>
      <input
        id="cc-pass"
        type="password"
        formControlName="password"
        placeholder="6-8 chars, mayúsc, minúsc, número"
        aria-required="true"
      />

      @if (error()) {
        <div class="error" role="alert">{{ error() }}</div>
      }

      <button type="submit" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Guardando...' : 'Cambiar contraseña' }}
      </button>
    </form>
  </div>
</div>
